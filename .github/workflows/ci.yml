# Checks every pull request and every push to staging and prod. Needs no secret: the repository is public.
name: CI

on:
  pull_request:
  push:
    branches: [staging, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The same empty Postgres as `pnpm db:test:up`, so the migrations prove they build a database from nothing.
    services:
      postgres:
        image: paradedb/paradedb:0.26.6-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --tmpfs /docker-entrypoint-initdb.d
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on a critical advisory in a runtime dependency; package.json lists the ones checked and accepted.
      - name: Advisories
        run: pnpm audit --prod --audit-level critical

      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit
          pnpm --filter admin-console exec tsc --noEmit -p .

      - name: Unit tests
        run: pnpm test

      - name: The schema and the migrations agree
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::The Drizzle schema has changes no migration describes. Run pnpm db:generate and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Migrations on an empty database
        run: pnpm exec tsx scripts/db/migrations.ts --apply

      - name: Integration tests
        run: pnpm test:db

      - name: Build
        run: |
          pnpm build
          pnpm --filter admin-console build
